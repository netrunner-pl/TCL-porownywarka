<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCL TV — porównywarka modeli</title>
<style>
:root{
  --red:#E60012;
  --ink:#16181d;
  --ink2:#565b66;
  --ink3:#8b909b;
  --line:#e4e6ea;
  --bg:#f6f7f9;
  --card:#ffffff;
  --diff:#fff8e1;
  --diffline:#f0b429;
  --chip:#eef0f3;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.45;
  padding-bottom:40px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}

/* ---------- header ---------- */
header{
  background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:60;
}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 12px;max-width:1180px;margin:0 auto}
.logo{
  font-weight:900;font-size:26px;letter-spacing:1px;color:var(--red);
  line-height:1;font-family:"Segoe UI",Arial,sans-serif;flex:0 0 auto;
}
.htitle{font-size:13px;font-weight:600;color:var(--ink2);line-height:1.2}
.htitle small{display:block;font-weight:400;color:var(--ink3);font-size:11px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:2px;padding:0 8px 0;max-width:1180px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto;background:none;border:none;border-bottom:3px solid transparent;
  padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink3);cursor:pointer;
  font-family:inherit;white-space:nowrap;
}
nav.tabs button.on{color:var(--red);border-bottom-color:var(--red)}

/* ---------- controls ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
.genbar{display:flex;align-items:center;gap:8px;padding:10px 2px 0}
.genbar .lbl{margin:0;flex:0 0 auto}
.row+.row{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--chip);border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;
  font-family:inherit;line-height:1.2;
}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.sm{padding:5px 10px;font-size:12px}
.chip:disabled{opacity:.35;cursor:not-allowed}
select{
  width:100%;font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238b909b' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
.acts{margin-left:6px;text-transform:none;letter-spacing:0}
.lnk{
  background:none;border:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--red);
  cursor:pointer;padding:0 5px;text-decoration:underline;text-underline-offset:2px;
}
.lnk+.lnk{border-left:1px solid var(--line)}
.tgl{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.tgl input{width:16px;height:16px;accent-color:var(--red);margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0 4px}

/* ---------- table ---------- */
.tblwrap{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 210px);
}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);}
thead th{
  position:sticky;top:0;z-index:3;background:#fff;font-size:11.5px;font-weight:700;
  color:var(--ink);border-bottom:2px solid var(--ink);white-space:normal;min-width:112px;
}
thead th .gen{display:block;font-weight:500;font-size:10px;color:var(--ink3);margin-top:1px}
th.rh{
  position:sticky;left:0;z-index:2;background:#fff;font-weight:600;color:var(--ink2);
  min-width:126px;max-width:126px;font-size:11.5px;
  box-shadow:1px 0 0 var(--line);
}
@media(max-width:520px){
  th,td{padding:6px 7px}
  th.rh{min-width:104px;max-width:104px;font-size:11px}
  thead th{min-width:98px;font-size:11px}
  table{font-size:12px}
}
thead th.rh{z-index:5;color:var(--ink)}
tbody tr:hover td{background:#fafbfc}
tr.same th.rh{background:#fafafb;color:var(--ink3);font-weight:500}
tr.same td{background:#fafafb;color:var(--ink3)}
tr.diff th.rh{box-shadow:inset 3px 0 0 var(--diffline),1px 0 0 var(--line)}
tr.diff td{font-weight:500}
td.empty{color:#c3c7cf}
tr.grouphead th{
  position:sticky;left:0;background:#f0f2f5;color:var(--ink);font-size:11px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;z-index:2;
}
.badge{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:4px;vertical-align:middle}
.b26{background:#e8f5e9;color:#1b7f2f}
.b25{background:#eceff1;color:#5b6670}

/* ---------- matrix picker ---------- */
.pickgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.pickgrid{grid-template-columns:1fr 1fr}}
.scroller{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
details.panel>summary{
  list-style:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{
  content:'▸';color:var(--red);font-size:13px;transition:transform .15s;flex:0 0 auto;
}
details.panel[open]>summary::before{content:'▾'}
details.panel>summary span{font-weight:400;color:var(--ink3);font-size:12px}
details.panel[open]>summary{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.counter{font-size:12px;font-weight:700;color:var(--ink3);float:right}
.counter.full{color:var(--red)}
.hint{font-size:12px;color:var(--ink3);margin:8px 0 0}
.empty-state{padding:26px 14px;text-align:center;color:var(--ink3);font-size:13.5px}
.foot{font-size:11px;color:var(--ink3);text-align:center;padding:14px 8px}
.count-line{font-size:12px;color:var(--ink3);margin:0 0 8px}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo">TCL</div>
    <div class="htitle">Porównywarka telewizorów
      <small id="subtitle">—</small>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="size" class="on">Wg rozmiaru</button>
    <button data-t="series">Wg serii</button>
    <button data-t="matrix">Matryca 4×20</button>
  </nav>
</header>

<div class="wrap">

  <div class="genbar">
    <div class="lbl">Rocznik</div>
    <div class="chips" id="genChips">
      <button class="chip sm on" data-g="all">Wszystkie</button>
      <button class="chip sm" data-g="2026">2026</button>
      <button class="chip sm" data-g="2025">2025</button>
    </div>
  </div>

  <!-- ============ SIZE ============ -->
  <section id="v-size">
    <div class="panel">
      <div class="lbl">Przekątne <span class="acts"><button class="lnk" id="sizeAll">wszystkie</button><button class="lnk" id="sizeNone">wyczyść</button></span></div>
      <div class="chips" id="sizeChips"></div>
    </div>
    <div class="toolbar">
      <label class="tgl"><input type="checkbox" id="sizeDiffOnly"> Tylko różnice</label>
      <label class="tgl"><input type="checkbox" id="sizeGroups" checked> Nagłówki sekcji</label>
      <span class="count-line" id="sizeInfo" style="margin:0"></span>
    </div>
    <div class="tblwrap" id="sizeTbl"></div>
  </section>

  <!-- ============ SERIES ============ -->
  <section id="v-series" hidden>
    <div class="panel">
      <div class="lbl">Serie <span class="acts"><button class="lnk" id="serAll">wszystkie</button><button class="lnk" id="serNone">wyczyść</button></span></div>
      <div class="chips" id="seriesChips"></div>
    </div>
    <div class="toolbar">
      <label class="tgl"><input type="checkbox" id="serDiffOnly"> Tylko różnice</label>
      <label class="tgl"><input type="checkbox" id="serGroups" checked> Nagłówki sekcji</label>
      <span class="count-line" id="serInfo" style="margin:0"></span>
    </div>
    <div class="tblwrap" id="seriesTbl"></div>
  </section>

  <!-- ============ MATRIX ============ -->
  <section id="v-matrix" hidden>
    <details class="panel" id="mxDetails" open>
      <summary id="mxSummary">Wybór modeli i cech</summary>
      <div class="pickgrid">
        <div>
          <div class="lbl">Modele <span class="acts"><button class="lnk" id="mxClearModels">wyczyść</button></span>
            <span class="counter" id="mCount">0 / 4</span></div>
          <div class="scroller"><div class="chips" id="modelPick"></div></div>
        </div>
        <div>
          <div class="lbl">Cechy <span class="acts"><button class="lnk" id="mxClearFeats">wyczyść</button></span>
            <span class="counter" id="fCount">0 / 20</span></div>
          <div class="chips" style="margin-bottom:8px" id="presetChips"></div>
          <div class="scroller"><div class="chips" id="featPick"></div></div>
        </div>
      </div>
      <p class="hint">Wybierz do 4 modeli i do 20 cech. Kliknij ponownie, aby odznaczyć. Zestawy dodają cechy do już wybranych.</p>
    </details>
    <div class="toolbar">
      <label class="tgl"><input type="checkbox" id="mxDiffOnly"> Tylko różnice</label>
      <button class="chip sm" id="mxClear">Wyczyść wszystko</button>
    </div>
    <div class="tblwrap" id="matrixTbl"></div>
  </section>

  <p class="foot">Dane: model-specs-MEX.xlsx · <span id="nModels"></span> modeli · <span id="nFeat"></span> parametrów</p>
</div>

const SERIES_ORDER = ['C8L','C7L','P8L','A400 Pro','A400U','A400','C8K','C7K','5C7K'];
const sIdx = s => { const i = SERIES_ORDER.indexOf(s); return i<0 ? 99 : i; };

const state = {
  tab: 'size',
  gen: 'all',
  sizes: [65],
  series: ['C8L'],
  mxModels: [],
  mxFeats: [],
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const genBadge = g => `<span class="badge ${g===2026?'b26':'b25'}">${g}</span>`;
const val = (m,k) => (m[k] || '').trim();

function pool(){ return state.gen==='all' ? M : M.filter(m => m._gen === +state.gen); }

/* ---------- generic comparison table ---------- */
function buildTable(models, keys, opts){
  opts = opts || {};
  if(!models.length) return '<div class="empty-state">Brak modeli dla tego wyboru.</div>';
  if(opts.diffOnly && models.length < 2)
    return '<div class="empty-state">Tryb „tylko różnice” wymaga co najmniej 2 modeli w porównaniu.</div>';
  const diffOf = k => new Set(models.map(m => val(m,k))).size > 1;

  let rowsHtml = '';
  const emit = (k) => {
    const d = diffOf(k);
    if(opts.diffOnly && !d) return;
    rowsHtml += `<tr class="${d?'diff':'same'}"><th class="rh">${esc(PL[k]||k)}</th>` +
      models.map(m => { const v = val(m,k);
        return v ? `<td>${esc(v)}</td>` : '<td class="empty">–</td>'; }).join('') + '</tr>';
  };

  if(opts.grouped){
    GROUPS.forEach(g => {
      const gk = g.keys.filter(k => keys.includes(k));
      if(!gk.length) return;
      const visible = opts.diffOnly ? gk.filter(diffOf) : gk;
      if(!visible.length) return;
      rowsHtml += `<tr class="grouphead"><th class="rh" colspan="${models.length+1}">${esc(g.name)}</th></tr>`;
      gk.forEach(emit);
    });
  } else {
    keys.forEach(emit);
  }

  if(!rowsHtml) return '<div class="empty-state">Wszystkie parametry są identyczne dla wybranych modeli.</div>';

  const head = `<thead><tr><th class="rh">Parametr</th>` +
    models.map(m => `<th>${esc(m.Model)}<span class="gen">${m._gen}</span></th>`).join('') +
    `</tr></thead>`;
  return `<table>${head}<tbody>${rowsHtml}</tbody></table>`;
}

/* ---------- SIZE (multi) ---------- */
function sizes(){ return [...new Set(pool().map(m=>m._size))].sort((a,b)=>a-b); }

function renderSize(){
  const ss = sizes();
  state.sizes = state.sizes.filter(s => ss.includes(s));
  document.getElementById('sizeChips').innerHTML =
    ss.map(s=>`<button class="chip sm ${state.sizes.includes(s)?'on':''}" data-s="${s}">${s}"</button>`).join('');

  const ms = pool().filter(m => state.sizes.includes(m._size))
    .sort((a,b)=> b._size-a._size || sIdx(a.Series)-sIdx(b.Series) || a.Model.localeCompare(b.Model));
  document.getElementById('sizeInfo').textContent =
    state.sizes.length ? `${ms.length} modeli w porównaniu` : '';
  document.getElementById('sizeTbl').innerHTML = state.sizes.length
    ? buildTable(ms, ALLKEYS, {
        grouped: document.getElementById('sizeGroups').checked,
        diffOnly: document.getElementById('sizeDiffOnly').checked })
    : '<div class="empty-state">Wybierz co najmniej jedną przekątną.</div>';
}

/* ---------- SERIES (multi) ---------- */
function seriesList(){
  return [...new Set(pool().map(m=>m.Series))]
    .sort((a,b)=> sIdx(a)-sIdx(b) || a.localeCompare(b,'pl'));
}
function renderSeries(){
  const sl = seriesList();
  state.series = state.series.filter(s => sl.includes(s));
  document.getElementById('seriesChips').innerHTML =
    sl.map(s=>`<button class="chip sm ${state.series.includes(s)?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('');

  const ms = pool().filter(m => state.series.includes(m.Series))
    .sort((a,b)=> sIdx(a.Series)-sIdx(b.Series) || b._size-a._size);
  document.getElementById('serInfo').textContent =
    state.series.length ? `${ms.length} modeli w porównaniu` : '';
  document.getElementById('seriesTbl').innerHTML = state.series.length
    ? buildTable(ms, ALLKEYS, {
        grouped: document.getElementById('serGroups').checked,
        diffOnly: document.getElementById('serDiffOnly').checked })
    : '<div class="empty-state">Wybierz co najmniej jedną serię.</div>';
}

/* ---------- MATRIX ---------- */
function renderMatrixPickers(){
  const p = pool();
  state.mxModels = state.mxModels.filter(id => p.some(m=>m.Model===id));
  const ms = p.slice().sort((a,b)=> b._size-a._size || a.Model.localeCompare(b.Model));
  const full = state.mxModels.length>=MAX_MODELS;
  document.getElementById('modelPick').innerHTML = ms.map(m=>{
    const on = state.mxModels.includes(m.Model);
    return `<button class="chip sm ${on?'on':''}" data-m="${esc(m.Model)}" ${(!on&&full)?'disabled':''}>${esc(m.Model)}</button>`;
  }).join('');
  const ffull = state.mxFeats.length>=MAX_FEATS;
  document.getElementById('featPick').innerHTML = GROUPS.map(g =>
    `<div style="width:100%;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8b909b;margin:6px 0 2px">${esc(g.name)}</div>` +
    g.keys.map(k=>{ const on = state.mxFeats.includes(k);
      return `<button class="chip sm ${on?'on':''}" data-f="${esc(k)}" ${(!on&&ffull)?'disabled':''}>${esc(PL[k]||k)}</button>`;
    }).join('')).join('');
  document.getElementById('presetChips').innerHTML =
    Object.keys(PRESETS).map(p=>`<button class="chip sm" data-p="${esc(p)}">${esc(p)}</button>`).join('');
  const mc = document.getElementById('mCount'), fc = document.getElementById('fCount');
  mc.textContent = `${state.mxModels.length} / ${MAX_MODELS}`; mc.classList.toggle('full', full);
  fc.textContent = `${state.mxFeats.length} / ${MAX_FEATS}`; fc.classList.toggle('full', ffull);
  document.getElementById('mxSummary').innerHTML = state.mxModels.length
    ? `Wybór: ${esc(state.mxModels.join(', '))} <span>· ${state.mxFeats.length} cech</span>`
    : `Wybór modeli i cech <span>· nic nie wybrano</span>`;
}
function renderMatrix(){
  renderMatrixPickers();
  const ms = state.mxModels.map(id => M.find(m=>m.Model===id)).filter(Boolean);
  const el = document.getElementById('matrixTbl');
  if(!ms.length || !state.mxFeats.length){
    el.innerHTML = '<div class="empty-state">Wybierz co najmniej 1 model i 1 cechę.</div>'; return;
  }
  const keys = ALLKEYS.filter(k => state.mxFeats.includes(k));
  el.innerHTML = buildTable(ms, keys, { grouped:false, diffOnly: document.getElementById('mxDiffOnly').checked });
}

/* ---------- routing ---------- */
const VIEWS = {size:renderSize, series:renderSeries, matrix:renderMatrix};
const SUB = {size:'wybierz jedną lub kilka przekątnych',
             series:'wybierz jedną lub kilka serii',
             matrix:'do 4 modeli × do 20 cech'};
function render(){
  ['size','series','matrix'].forEach(t =>
    document.getElementById('v-'+t).hidden = (t!==state.tab));
  [...document.querySelectorAll('#tabs button')].forEach(b => b.classList.toggle('on', b.dataset.t===state.tab));
  document.getElementById('subtitle').textContent = SUB[state.tab];
  VIEWS[state.tab]();
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  state.tab = b.dataset.t; render(); window.scrollTo({top:0});
});
document.getElementById('genChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  state.gen = b.dataset.g;
  [...e.currentTarget.children].forEach(c=>c.classList.toggle('on', c===b));
  render();
});
const toggle = (arr,v) => { const i = arr.indexOf(v); i>=0 ? arr.splice(i,1) : arr.push(v); };

document.getElementById('sizeChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; toggle(state.sizes, +b.dataset.s); renderSize();
});
document.getElementById('seriesChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; toggle(state.series, b.dataset.s); renderSeries();
});
document.getElementById('sizeAll').addEventListener('click', () => { state.sizes = sizes(); renderSize(); });
document.getElementById('sizeNone').addEventListener('click', () => { state.sizes = []; renderSize(); });
document.getElementById('serAll').addEventListener('click', () => { state.series = seriesList(); renderSeries(); });
document.getElementById('serNone').addEventListener('click', () => { state.series = []; renderSeries(); });
['sizeDiffOnly','sizeGroups'].forEach(id => document.getElementById(id).addEventListener('change', renderSize));
['serDiffOnly','serGroups'].forEach(id => document.getElementById(id).addEventListener('change', renderSeries));
document.getElementById('mxDiffOnly').addEventListener('change', renderMatrix);
document.getElementById('mxClearFeats').addEventListener('click', () => { state.mxFeats = []; renderMatrix(); });
document.getElementById('mxClearModels').addEventListener('click', () => { state.mxModels = []; renderMatrix(); });
document.getElementById('modelPick').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  const id = b.dataset.m, i = state.mxModels.indexOf(id);
  if(i>=0) state.mxModels.splice(i,1); else if(state.mxModels.length<MAX_MODELS) state.mxModels.push(id);
  renderMatrix();
});
document.getElementById('featPick').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  const k = b.dataset.f, i = state.mxFeats.indexOf(k);
  if(i>=0) state.mxFeats.splice(i,1); else if(state.mxFeats.length<MAX_FEATS) state.mxFeats.push(k);
  renderMatrix();
});
document.getElementById('presetChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  PRESETS[b.dataset.p].forEach(k => {
    if(!state.mxFeats.includes(k) && state.mxFeats.length < MAX_FEATS) state.mxFeats.push(k);
  });
  renderMatrix();
});
document.getElementById('mxClear').addEventListener('click', () => {
  state.mxModels = []; state.mxFeats = []; renderMatrix();
});

render();
</script>
</body>
</html>
